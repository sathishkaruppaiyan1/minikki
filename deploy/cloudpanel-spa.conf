# CloudPanel (Nginx) — fixes "404 on refresh" and "404 when sharing a link"
#
# WHY IT BREAKS
# React Router builds URLs like /checkout and /product/123 in the browser.
# No such file exists on disk. Loading the home page works because index.html
# is real; pressing refresh or opening a shared link asks Nginx for a path it
# cannot find, so it returns its own 404. The app never gets a chance to run.
#
# .htaccess CANNOT fix this — Nginx does not read .htaccess files at all.
# The vhost must be told to fall back to index.html.
#
# ---------------------------------------------------------------------------
# HOW TO APPLY
#   1. CloudPanel → Sites → <your site> → Vhost
#   2. Find the existing `location / { ... }` block
#   3. Replace it with the block below (keep everything else as-is)
#   4. Save. CloudPanel validates the config and reloads Nginx automatically.
#      If it refuses to save, the syntax error is reported at the top.
#
# The document root must be the folder that CONTAINS index.html — i.e. the
# contents of dist/, not the dist folder itself. Verify with:
#   ls /home/<site-user>/htdocs/<domain>/index.html
# ---------------------------------------------------------------------------

# The one line that actually fixes the 404. $uri is tried first so real files
# still win; anything else renders the SPA with a 200.
location / {
    try_files $uri $uri/ /index.html;
}

# Vite writes content-hashed filenames (index-5ipAA1xI.js), so these can be
# cached forever — the name changes whenever the content does.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# index.html must NOT be cached. It holds the references to the hashed assets;
# a stale copy points at files deleted by the last deploy and the site loads
# as a blank white page.
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
}

# Optional: stop the deploy-support files from being downloadable.
location ~ /\.(htaccess|env) {
    deny all;
}
