# Plain Nginx (VPS, Docker, self-managed) — full server block for the SPA.
#
# For CloudPanel use deploy/cloudpanel-spa.conf instead: you edit the existing
# vhost there rather than writing a whole server block.

server {
    listen 80;
    server_name minikki.in www.minikki.in;

    # Point this at the folder CONTAINING index.html (the contents of dist/).
    root /var/www/minikki;
    index index.html;

    # SPA fallback: real files win, everything else renders index.html with a
    # 200 so /checkout and /product/123 survive refresh and link sharing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Content-hashed build output — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the entry point, or a redeploy leaves users on a stale
    # index.html that references deleted asset filenames (blank white page).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~ /\.(htaccess|env) {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
