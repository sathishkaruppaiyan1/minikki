# Must match the project the app actually talks to (VITE_SUPABASE_URL in .env).
# The previous value pointed at a project with no functions deployed, so CLI
# deploys from this repo silently landed nowhere.
project_id = "qksewiceckymrsvgxkfg"

[functions.woocommerce-products]
verify_jwt = false

[functions.woocommerce-categories]
verify_jwt = false

[functions.woocommerce-reviews]
verify_jwt = false

[functions.woocommerce-taxes]
verify_jwt = false

[functions.woocommerce-variation-gallery]
verify_jwt = false

[functions.interakt-send-review]
verify_jwt = false

[functions.interakt-tracking-update]
verify_jwt = false

[functions.interakt-account-creation]
verify_jwt = false

[functions.interakt-send-otp]
verify_jwt = false

[functions.interakt-verify-otp]
verify_jwt = false

[functions.initiate-easebuzz-payment]
verify_jwt = false

[functions.verify-easebuzz-payment]
verify_jwt = false

# Called from the guest checkout (no Supabase user session exists).
[functions.create-razorpay-order]
verify_jwt = false

# Guest checkout too; authenticity comes from the HMAC signature it verifies,
# not from the caller's token.
[functions.verify-razorpay-payment]
verify_jwt = false

# MUST be false: Razorpay sends no Supabase credentials. The request is
# authenticated by the x-razorpay-signature HMAC instead.
[functions.razorpay-webhook]
verify_jwt = false

# Checks the service-role bearer token itself (see the function source).
[functions.razorpay-reconcile]
verify_jwt = false

# WhatsApp OTP login (Meta Cloud API). Called from the login screen before any
# Supabase session exists.
[functions.whatsapp-send-otp]
verify_jwt = false

[functions.verify-otp]
verify_jwt = false
